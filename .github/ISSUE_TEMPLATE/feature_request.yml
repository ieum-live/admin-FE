name: 기능 요청 (Feature Request)
description: 앱 및 어드민 페이지에 필요한 새로운 기능이나 개선 아이디어를 제안하는 템플릿입니다.
title: "[FEATURE] "
labels: [enhancement]
assignees: []

body:
  - type: textarea
    id: feature-description
    attributes:
      label: 🌟 기능 설명 (Describe the feature)
      description: 어떤 기능을 추가하거나 개선하고 싶은지 명확하고 구체적으로 작성해주세요.
      placeholder: |
        예) 관리자 대시보드에 유저 활동 로그 상세 조회 기능을 추가하고 싶습니다.
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: 📌 필요 이유 (Why is it needed?)
      description: 이 기능이 필요한 이유, 해결하려는 문제 등을 작성해주세요.
      placeholder: |
        예) 현재는 최근 활동 5개만 확인 가능해 상세 분석이 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 💡 고려한 대안 (Alternatives)
      description: 이 기능을 구현하기 위한 다른 접근 방식이 있다면 적어주세요.
      placeholder: |
        예) 백엔드에서 필터링된 로그만 가져오는 API를 따로 만드는 방법도 고려했습니다.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 내용 (Additional context)
      description: 관련 스크린샷, 문서 링크, UX 참고 자료 등 추가로 공유할 정보가 있다면 작성해주세요.
      placeholder: |
        예) 기존 대시보드 UI 구조 참고용 이미지, 유사 서비스 예시 링크 등
    validations:
      required: false
