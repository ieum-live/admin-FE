name: 코드 리팩토링 (Code Refactoring)
description: 어드민 / 앱 프런트엔드 코드 구조 개선 및 성능 최적화를 위한 리팩토링 제안 템플릿입니다.
title: "[REFACTOR] "
labels: [refactor]
assignees: []

body:
  - type: input
    id: target-code
    attributes:
      label: 🔄 리팩토링 대상 파일 또는 영역 (Target code)
      description: 어떤 파일 또는 컴포넌트/모듈을 리팩토링하려고 하나요?
      placeholder: 예) DashboardTable.tsx, QuestService.ts, AdminUserList.tsx
    validations:
      required: true

  - type: textarea
    id: issue-description
    attributes:
      label: 🤔 문제점 설명 (What’s the issue?)
      description: 현재 코드에서 구조적 문제, 중복 로직, 비효율성 등을 구체적으로 작성해주세요.
      placeholder: |
        예) DashboardTable.tsx에서 데이터 가공 로직과 UI 로직이 혼재되어 있어 유지보수가 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 💡 개선 아이디어 (Suggested improvement)
      description: 어떻게 개선할지 구체적인 리팩토링 방안을 적어주세요.
      placeholder: |
        예) 데이터 포맷 변환 로직을 utils로 분리하고, 테이블 렌더링 로직을 컴포넌트 단위로 나누기.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 💻 참고용 코드 스타일 가이드 (Examples)

        #### **TypeScript (React Admin / React Native)**
        ```tsx
        // 기존
        const Dashboard = () => {
          const data = fetchData().map(item => ({ ... }));
          return <Table items={data} />;
        };

        // 개선 제안
        const formatDashboardData = (raw) => raw.map(item => ({ ... }));

        const Dashboard = () => {
          const raw = fetchData();
          const data = formatDashboardData(raw);
          return <Table items={data} />;
        };
        ```

        #### **Kotlin (Spring Boot)**
        ```kotlin
        // 기존
        if (user.role == "ADMIN") {
            // ...
        }

        // 제안
        fun User.isAdmin() = this.role == "ADMIN"
        if (user.isAdmin()) { ... }
        ```

        #### **Python (CV / ML / Backend util)**
        ```python
        # 기존
        model = load_model("emotion_model.h5")
        result = model.predict(frame.reshape(1, 48, 48, 1))

        # 제안
        def predict_emotion(model_path: str, frame):
            model = load_model(model_path)
            return model.predict(frame.reshape(1, 48, 48, 1))

        result = predict_emotion("emotion_model.h5", frame)
        ```

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 내용 (Additional context)
      description: 성능 개선 기대, 유지보수 관점, 관련 문서 등 추가로 참고할 내용을 작성해주세요.
      placeholder: |
        예) API 응답 변경 예정이라 구조 분리가 필요합니다.
    validations:
      required: false
